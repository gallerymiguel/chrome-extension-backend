name: Backend CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        env:
          JWT_SECRET: devjwt1234567890devjwt1234567890
          MONGO_URI: mongodb://127.0.0.1:27017/chrome-extension-backend-ci
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/chrome-extension-backend-ci
        run: npm test
