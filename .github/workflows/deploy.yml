name: Deploy to Linux Box

on:
  push:
    branches: [main]  # or 'master' depending on your branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script on Linux box
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.LINUX_BOX_HOST }}
          username: ${{ secrets.LINUX_BOX_USER }}
          key: ${{ secrets.LINUX_BOX_SSH_KEY }}
          script: |
            cd /home/user/devops-playground/video-audio-ai
            ./deploy.sh
